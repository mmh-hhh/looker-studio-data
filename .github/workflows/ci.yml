name: cross-platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run self-test
      - run: node scripts/looker_studio_data.cjs security-audit
